# SPDX-License-Identifier: Apache-2.0
#
# Debug overlay: re-enables the UART console on top of the low-power
# production configuration in prj.conf.
#
#     west build -b distancer . -- -DEXTRA_CONF_FILE=debug.conf
#
# Read it with 115200 8N1 on the debug probe's virtual COM port, e.g.
#
#     picocom -b 115200 /dev/ttyACM0
#
# This costs power (the UART stays powered) - do not ship it.

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y

CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y

# Synchronous logging: messages are rendered from the calling thread instead
# of being queued for a background log thread, so nothing is lost or
# truncated when the system faults or hangs.
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_ASSERT=y
CONFIG_EXCEPTION_DEBUG=y
CONFIG_THREAD_NAME=y
