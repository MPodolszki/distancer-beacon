#
# iBeacon configuration for the distancer board - low-power production build.
#
# For a build with console output over UART (115200 8N1 on the debug probe's
# virtual COM port), add the debug overlay:
#
#     west build -b distancer . -- -DEXTRA_CONF_FILE=debug.conf

# --- Power -----------------------------------------------------------------
#
# No serial, no logging: the UART peripheral draws current continuously while
# enabled (the receiver stays powered even when nothing is transmitted), which
# is significant next to a beacon that only wakes ~once a second. Zephyr runs
# tickless, so with no console and no stray periodic work the core stays in
# WFI between radio events and LED pulses.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n

# Debug aids cost flash and runtime work; leave them to the debug overlay.
CONFIG_ASSERT=n
CONFIG_THREAD_NAME=n

# --- Bluetooth: broadcaster only (no connections needed for a pure beacon) --
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="distancer-beacon"

# The device never accepts connections, so drop the peripheral/central roles
# and the connection machinery entirely.
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_CENTRAL=n
CONFIG_BT_OBSERVER=n

# The controller's advanced XTAL/HFCLK startup-timing optimization measures a
# wildly wrong preemption overhead on this board (tens of milliseconds instead
# of microseconds, per its own "Actual EVENT_OVERHEAD_START_US" debug print)
# and trips its internal safety assert (LL_ASSERT_OVERHEAD in lll_adv.c),
# halting the system a few seconds into advertising.
#
# NOTE: BT_CTLR_XTAL_ADVANCED lives behind a "visible if
# BT_CTLR_ADVANCED_FEATURES" menu. That gate has to be enabled first, or
# Kconfig silently ignores the override below and keeps the default (y).
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
# CONFIG_BT_CTLR_XTAL_ADVANCED is not set

# The on/off button switches the device into nRF52 System OFF, from which the
# button itself and the charger line wake it again (via GPIO SENSE, so the
# wake-up is a reset - the application comes back through main()).
CONFIG_POWEROFF=y

# --- Peripherals used by the app -------------------------------------------
CONFIG_GPIO=y

# RGB LEDs are driven over PWM (same module/colours as the distancer app).
CONFIG_PWM=y

# Battery voltage measurement (vbatt voltage-divider node -> ADC).
CONFIG_ADC=y

# Front buttons and the LTC4060 charge-status line are the board's "buttons"
# gpio-keys node. The driver debounces them and reports edges as input events
# (interrupt driven, so an idle device is not polled).
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y

# NOTE: this image is built to run standalone, linked at 0x0 without a
# bootloader.
#
# Chain-loading this application from MCUboot leaves the kernel's RTC timer
# interrupt dead: k_uptime_get() still advances (it reads the counter
# directly), but k_sleep() never returns and k_timer never fires, so the LED
# blink and the status logging never run. This is NOT specific to this
# application - the stock Zephyr samples/basic/blinky shows the same:
#   built standalone                          -> "LED state: ON/OFF" repeats
#   built with SB_CONFIG_BOOTLOADER_MCUBOOT=y -> prints once, then dead
# Re-test that comparison before re-enabling MCUboot here.

# --- Radio: Sendeleistung ---------------------------------------------------
#
# Bleibt auf dem Standard von 0 dBm.
#
# CONFIG_BT_CTLR_TX_PWR_PLUS_4 wurde probiert und wieder entfernt: der Symbol
# landete nachweislich im Image (CONFIG_BT_CTLR_TX_PWR_DBM=4), aber am
# Empfaenger war davon nichts zu messen. A/B an unveraenderter Position, je
# rund 15 Messwerte ueber 70 s:
#
#     +4 dBm -> Median -63 dBm
#      0 dBm -> Median -63 dBm
#
# Bevor das jemand erneut versucht: erst nachmessen, ob die Einstellung auf
# dieser Hardware ueberhaupt durchschlaegt. Wenn ja, muss IBEACON_RSSI in
# src/main.c mitgezogen werden, sonst schaetzen Empfaenger die Distanz falsch.
